  <style>
    :root{ --red:#d6283b; --green:#1f8a4c; --gold:#f2b705; --cream:#fff8ee; }
    *{box-sizing:border-box;}
    body{
      margin:0; font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif; color:#2b2b2b;
      text-align:center; min-height:100vh;
      background:
        radial-gradient(circle at 15% 12%, rgba(255,255,255,.55) 0 2px, transparent 3px) ,
        radial-gradient(circle at 70% 25%, rgba(255,255,255,.5) 0 2px, transparent 3px) ,
        radial-gradient(circle at 42% 60%, rgba(255,255,255,.5) 0 2px, transparent 3px) ,
        radial-gradient(circle at 88% 70%, rgba(255,255,255,.5) 0 2px, transparent 3px) ,
        linear-gradient(160deg,#2a7d53 0%, #1f8a4c 45%, #16623a 100%);
      background-attachment:fixed;
    }
    header{ padding:26px 16px 6px; }
    h1{
      margin:0; font-size:clamp(1.8rem,6vw,3rem); color:#fff;
      text-shadow:0 2px 0 var(--red), 0 4px 10px rgba(0,0,0,.35); letter-spacing:.5px;
    }
    .sub{
      display:inline-block; margin:14px auto 4px; padding:12px 18px; max-width:620px;
      background:var(--cream); border-radius:16px; font-size:clamp(1rem,3.4vw,1.25rem);
      box-shadow:0 6px 14px rgba(0,0,0,.2); border:3px dashed var(--gold); line-height:1.4;
    }
    .sub b{ color:var(--red); }
    .grid{
      display:grid; gap:16px; padding:22px 16px 40px; max-width:900px; margin:0 auto;
      grid-template-columns:repeat(2,1fr);
    }
    @media(min-width:560px){ .grid{grid-template-columns:repeat(3,1fr);} }
    @media(min-width:820px){ .grid{grid-template-columns:repeat(4,1fr);} }
    .card{
      border:0; background:none; padding:0; cursor:pointer; perspective:1000px;
      aspect-ratio:1/1; font-family:inherit;
    }
    .inner{ position:relative; width:100%; height:100%; transition:transform .6s;
      transform-style:preserve-3d; }
    .card.flipped .inner{ transform:rotateY(180deg); }
    .face{
      position:absolute; inset:0; backface-visibility:hidden; border-radius:20px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:var(--cream); box-shadow:0 8px 16px rgba(0,0,0,.28);
      border:5px solid #fff; overflow:hidden;
    }
    .front img, .recip{
      width:72%; aspect-ratio:1/1; object-fit:cover; border-radius:50%;
      border:4px solid var(--gold); box-shadow:0 3px 8px rgba(0,0,0,.25); background:#ddd;
    }
    .name{ margin-top:8px; font-weight:bold; font-size:clamp(1rem,3.6vw,1.3rem); color:var(--green); }
    .front::after{ content:"👆 tap me"; font-size:.8rem; color:#999; margin-top:3px; }
    .back{
      transform:rotateY(180deg);
      background:linear-gradient(160deg,#fff 0%, #ffe9ec 100%); border-color:var(--red);
    }
    .cap{ font-size:.85rem; color:var(--red); font-weight:bold; text-transform:uppercase; letter-spacing:.5px; }
    .recip{ margin:6px 0 4px; border-color:var(--red); }
    .recip-name{ font-size:clamp(1.1rem,4vw,1.5rem); font-weight:bold; color:var(--red); }
    .tap{ font-size:.72rem; color:#aa8; margin-top:4px; }
    footer{ padding:0 16px 34px; }
    footer a{ color:#fff; font-weight:bold; font-size:1.05rem; text-decoration:none;
      background:var(--red); padding:10px 20px; border-radius:30px; display:inline-block;
      box-shadow:0 5px 10px rgba(0,0,0,.3); }
    footer a:hover{ background:#b51f30; }
  </style>
</head>

  <script>
    const santa = {"Mads": "Duke", "Duke": "Juliet", "Juliet": "Sebas", "Sebas": "Milly", "Milly": "Bebe", "Bebe": "Raf", "Raf": "Elsa", "Elsa": "Raph", "Raph": "Fafa", "Fafa": "Naomi", "Naomi": "Nano", "Nano": "Nasser", "Nasser": "Felix", "Felix": "Mads"};
    function reveal(card){
      const to = card.dataset.to;
      if(card.classList.contains('flipped')){ card.classList.remove('flipped'); return; }
      const recip = santa[to];
      const img = card.querySelector('.recip');
      img.src = 'kids/' + recip + '.jpg';
      img.alt = recip;
      card.querySelector('.recip-name').textContent = recip;
      card.classList.add('flipped');
    }
  </script>
